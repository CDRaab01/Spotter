name: CI

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Weekly bit-rot check (Mondays 06:00 UTC) so "green" stays meaningful between pushes.
    # Deploy is guarded against scheduled runs (see deploy.yml) so this never ships.
    - cron: "0 6 * * 1"

jobs:
  # ── Server ────────────────────────────────────────────────────────────────

  server-lint:
    name: "Server — Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.4.4
      - run: ruff check app
        working-directory: server

  server-test:
    name: "Server — Test"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spotter
          POSTGRES_PASSWORD: spotter
          POSTGRES_DB: spotter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://spotter:spotter@localhost:5432/spotter_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      LM_STUDIO_BASE_URL: http://localhost:1234/v1
      LM_STUDIO_MODEL: test-model
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest tests/ -v --tb=short

  # ── Android ───────────────────────────────────────────────────────────────

  android-test:
    name: "Android — Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Spotter/android
    steps:
      - uses: actions/checkout@v7
        with:
          path: Spotter
      # Composite build needs the sibling Pulse repo (settings.gradle.kts includeBuild ../../Pulse).
      - uses: actions/checkout@v7
        with:
          repository: CDRaab01/Pulse
          path: Pulse
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.SPOTTER_SERVER_URL || 'https://spotter.dragonflymedia.org/' }}" >> local.properties
      - run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-screenshots:
    name: "Android — UI Screenshots"
    runs-on: ubuntu-latest
    needs: android-test
    defaults:
      run:
        working-directory: Spotter/android
    steps:
      - uses: actions/checkout@v7
        with:
          path: Spotter
      # Composite build needs the sibling Pulse repo (settings.gradle.kts includeBuild ../../Pulse).
      - uses: actions/checkout@v7
        with:
          repository: CDRaab01/Pulse
          path: Pulse
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.SPOTTER_SERVER_URL || 'https://spotter.dragonflymedia.org/' }}" >> local.properties
      # Compare mode: renders the redesigned UI and diffs it against the committed baselines
      # in app/screenshots/. It produces actual/compare images without failing on pixel drift,
      # so every PR gets a fresh visual gallery. (Flip to `-Proborazzi.test.verify=true` to gate
      # on diffs once the baselines have been re-recorded on the CI runner.)
      - run: >-
          ./gradlew :app:testDebugUnitTest
          --tests "com.spotter.screenshot.ScreenshotTest"
          --no-daemon -Proborazzi.test.compare=true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots-${{ github.sha }}
          path: |
            Spotter/android/app/screenshots/**
            Spotter/android/app/build/outputs/roborazzi/**
          retention-days: 30

  android-build:
    name: "Android — Assemble Debug APK"
    runs-on: ubuntu-latest
    needs: android-test
    defaults:
      run:
        working-directory: Spotter/android
    steps:
      - uses: actions/checkout@v7
        with:
          path: Spotter
      # Composite build needs the sibling Pulse repo (settings.gradle.kts includeBuild ../../Pulse).
      - uses: actions/checkout@v7
        with:
          repository: CDRaab01/Pulse
          path: Pulse
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.SPOTTER_SERVER_URL || 'https://spotter.dragonflymedia.org/' }}" >> local.properties
      - run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: spotter-debug-${{ github.sha }}
          path: Spotter/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  android-release-build:
    name: "Android — Assemble Release APK"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: android-test
    defaults:
      run:
        working-directory: Spotter/android
    steps:
      - uses: actions/checkout@v7
        with:
          path: Spotter
      # Composite build needs the sibling Pulse repo (settings.gradle.kts includeBuild ../../Pulse).
      - uses: actions/checkout@v7
        with:
          repository: CDRaab01/Pulse
          path: Pulse
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.SPOTTER_SERVER_URL || 'https://spotter.dragonflymedia.org/' }}" >> local.properties
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: spotter-release-${{ github.sha }}
          path: Spotter/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  publish:
    name: "Publish — GitHub Release"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android-build, android-release-build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spotter-debug-${{ github.sha }}
          path: dist/debug
      - uses: actions/download-artifact@v8
        with:
          name: spotter-release-${{ github.sha }}
          path: dist/release
      - name: Rename APKs with version tag
        run: |
          mv dist/debug/app-debug.apk   dist/spotter-${{ github.ref_name }}-debug.apk
          mv dist/release/app-release.apk dist/spotter-${{ github.ref_name }}-release.apk
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/spotter-${{ github.ref_name }}-debug.apk
            dist/spotter-${{ github.ref_name }}-release.apk
