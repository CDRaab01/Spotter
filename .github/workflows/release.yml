name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to build and publish (e.g. v1.1)
        required: true
        type: string

jobs:
  android-test:
    name: "Android — Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.SPOTTER_SERVER_URL || 'https://spotter.dragonflymedia.org/' }}" >> local.properties
      - run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-build:
    name: "Android — Build Signed Release APK"
    runs-on: ubuntu-latest
    needs: android-test
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.SPOTTER_SERVER_URL || 'https://spotter.dragonflymedia.org/' }}" >> local.properties
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.tag }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk spotter-${{ github.event.inputs.tag }}.apk
      # Dragonfly (the suite hub) reads this asset to learn the release's versionCode — the
      # GitHub API only exposes the tag. Keep the values in lock-step with the gradle env above.
      - name: Generate version.json for Dragonfly
        run: |
          SHA256=$(sha256sum spotter-${{ github.event.inputs.tag }}.apk | cut -d' ' -f1)
          printf '{"versionCode": %d, "versionName": "%s", "sha256": "%s", "minSdk": 26}\n' \
            "${{ github.run_number }}" "${{ github.event.inputs.tag }}" "$SHA256" > version.json
          cat version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            android/spotter-${{ github.event.inputs.tag }}.apk
            android/version.json
