name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to build and publish (e.g. v1.1)
        required: true
        type: string

jobs:
  android-test:
    name: "Android — Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.SPOTTER_SERVER_URL || 'http://10.0.2.2:8000/' }}" >> local.properties
      - run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-build:
    name: "Android — Build APKs"
    runs-on: ubuntu-latest
    needs: android-test
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "server.url=${{ vars.SPOTTER_SERVER_URL || 'http://10.0.2.2:8000/' }}" >> local.properties
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk   spotter-${{ github.event.inputs.tag }}-debug.apk
          cp app/build/outputs/apk/release/app-release.apk spotter-${{ github.event.inputs.tag }}-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            android/spotter-${{ github.event.inputs.tag }}-debug.apk
            android/spotter-${{ github.event.inputs.tag }}-release.apk
