services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: spotter
      POSTGRES_DB: spotter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotter -d spotter"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Reach Postgres over the compose network; overrides DATABASE_URL from .env.
      DATABASE_URL: postgresql+asyncpg://spotter:spotter@db:5432/spotter
    depends_on:
      db:
        condition: service_healthy
    # Published on localhost only — cloudflared reaches it over the compose network.
    ports:
      - "127.0.0.1:8000:8000"

  # Public entrypoint. Only started with: docker compose --profile tunnel up -d
  # Uses a remotely-managed tunnel token (Cloudflare dashboard -> Tunnels -> your tunnel).
  # In the dashboard, point the public hostname at http://server:8000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      - server
    profiles:
      - tunnel

volumes:
  pgdata:
